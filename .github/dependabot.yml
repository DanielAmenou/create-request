# Keeps the commit-SHA pins in .github/workflows current: one grouped pull request a week when an action has a new
# release (the version is in the comment after each SHA).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
